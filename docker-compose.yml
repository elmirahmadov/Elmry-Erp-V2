services:
  mysql:
    image: mysql:8.0
    container_name: elmry-erp-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: elmryroot
      MYSQL_DATABASE: elmry_erp
      MYSQL_USER: elmry
      MYSQL_PASSWORD: elmry
    volumes:
      - elmry_erp_mysql_data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --lower-case-table-names=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uelmry", "-pelmry"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: elmry-erp-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: mysql://elmry:elmry@mysql:3306/elmry_erp
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173,http://localhost:8080,http://127.0.0.1:5173
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: elmry-erp-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  elmry_erp_mysql_data:
